<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="754" viewBox="0 0 1120 754" role="img" aria-labelledby="title description">
  <title id="title">Mesh-Talk architecture overview</title>
  <desc id="description">The React desktop interface and Tauri host, the headless CLI, and scoped local agents use a shared UI-free Rust protocol core. The core owns identity, encryption, event synchronization, discovery, transport and encrypted local stores. Devices connect directly to peers; optional peer-operated post offices hold encrypted events for offline delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#59728c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="relay-arrow" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#54847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182d43; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #526c87; }
      .heading { font-size: 31px; font-weight: 650; letter-spacing: -.6px; }
      .subheading { font-size: 16px; fill: #52677e; }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #526c87; }
      .label { font-size: 20px; font-weight: 650; letter-spacing: -.25px; }
      .detail { font-size: 15px; fill: #52677e; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #52677e; }
      .path { fill: none; stroke: #59728c; stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
      .path-label { font-size: 12px; font-weight: 600; fill: #52677e; }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="752" rx="22" fill="#f8fafc" stroke="#dce4ed"/>
  <text class="eyebrow" x="48" y="44">MESH-TALK / SYSTEM OVERVIEW</text>
  <text class="heading" x="48" y="88">One protocol core. Connected on your terms.</text>
  <text class="subheading" x="48" y="118">Local-first messaging across macOS, Windows and Linux.</text>

  <text class="section" x="48" y="169">APPLICATIONS</text>
  <text class="section" x="392" y="169">SHARED PROTOCOL</text>
  <text class="section" x="784" y="169">YOUR NETWORK</text>

  <rect x="48" y="190" width="274" height="218" rx="14" fill="#fff" stroke="#dce4ed"/>
  <text class="label" x="70" y="225">Desktop app</text>
  <rect x="70" y="244" width="230" height="59" rx="8" fill="#f1f5fa"/>
  <text x="86" y="269" font-size="16" font-weight="600">React + TypeScript</text>
  <text class="detail" x="86" y="290">Conversations and controls</text>
  <path d="M185 309v16" class="path"/>
  <text x="70" y="353" font-size="17" font-weight="600">Tauri desktop host</text>
  <text class="detail" x="70" y="378">IPC, sessions and OS integration</text>

  <rect x="48" y="432" width="274" height="228" rx="14" fill="#fff" stroke="#dce4ed"/>
  <text class="label" x="70" y="467">Headless and agents</text>
  <text x="70" y="502" font-size="16" font-weight="600">Standalone node / CLI</text>
  <text class="code" x="70" y="525">mesh-talk-node</text>
  <path d="M70 543H300" stroke="#e4eaf1"/>
  <text x="70" y="573" font-size="16" font-weight="600">Scoped local automation</text>
  <text class="code" x="70" y="598">mesh-talk-mcp → private IPC</text>
  <text class="code" x="70" y="619">mesh-talk-integrations host</text>
  <text class="detail" x="70" y="644">Explicit grants on the local host</text>

  <rect x="392" y="190" width="322" height="470" rx="14" fill="#edf3fc" stroke="#b7cceb"/>
  <rect x="392" y="190" width="5" height="470" rx="2.5" fill="#4679be"/>
  <text class="label" x="416" y="225">Rust protocol core</text>
  <text class="code" x="416" y="250">mesh-talk-core · NodeRuntime</text>
  <rect x="416" y="273" width="274" height="76" rx="9" fill="#fff" stroke="#d9e3f1"/>
  <text x="434" y="301" font-size="17" font-weight="600">Identity and encryption</text>
  <text class="detail" x="434" y="327">Device keys, DMs and group keys</text>
  <rect x="416" y="363" width="274" height="76" rx="9" fill="#fff" stroke="#d9e3f1"/>
  <text x="434" y="391" font-size="17" font-weight="600">Events and recovery</text>
  <text class="detail" x="434" y="417">Signed history, sync and files</text>
  <rect x="416" y="453" width="274" height="76" rx="9" fill="#fff" stroke="#d9e3f1"/>
  <text x="434" y="481" font-size="17" font-weight="600">Discovery and transport</text>
  <text class="detail" x="434" y="507">Signed UDP · authenticated TCP</text>
  <rect x="416" y="543" width="274" height="76" rx="9" fill="#fff" stroke="#d9e3f1"/>
  <text x="434" y="571" font-size="17" font-weight="600">Encrypted local stores</text>
  <text class="detail" x="434" y="597">Keys, logs and persisted state</text>
  <text class="detail" x="416" y="643">UI-free · shared across every host</text>

  <path class="path" d="M328 355H386"/>
  <text class="path-label" x="357" y="340" text-anchor="middle">core API</text>
  <path class="path" d="M328 550H386"/>
  <text class="path-label" x="357" y="535" text-anchor="middle">core API</text>

  <rect x="784" y="190" width="288" height="214" rx="14" fill="#fff" stroke="#dce4ed"/>
  <circle cx="810" cy="222" r="4" fill="#4679be"/>
  <text class="section" x="825" y="226">DIRECT PEERS</text>
  <text class="label" x="806" y="266">Other devices</text>
  <text class="detail" x="806" y="296">Authorized people and groups</text>
  <text class="detail" x="806" y="320">Linked devices on one account</text>
  <path d="M806 340H1050" stroke="#e4eaf1"/>
  <text class="detail" x="806" y="367">LAN or existing routed networks</text>
  <text class="detail" x="806" y="388">End-to-end-encrypted content</text>
  <path class="path" d="M720 297H778"/>
  <text class="path-label" x="749" y="280" text-anchor="middle">Noise</text>
  <text class="path-label" x="749" y="322" text-anchor="middle">TCP</text>

  <rect x="784" y="432" width="288" height="228" rx="14" fill="#eef7f4" stroke="#b9d6cf"/>
  <text class="section" x="806" y="467" style="fill:#47746b">OPTIONAL DELIVERY PATH</text>
  <text class="label" x="806" y="505">Peer-operated post office</text>
  <text class="detail" x="806" y="537">Temporary encrypted custody</text>
  <text class="detail" x="806" y="561">Delivery when a recipient returns</text>
  <path d="M806 581H1050" stroke="#cfe0da"/>
  <text class="detail" x="806" y="609">Opt-in bridges between sites</text>
  <text class="detail" x="806" y="633">No vendor-operated server</text>
  <path d="M720 550H778" fill="none" stroke="#54847d" stroke-width="1.8" stroke-dasharray="5 5" marker-start="url(#relay-arrow)" marker-end="url(#relay-arrow)"/>

  <path d="M48 687H1072" stroke="#dce4ed"/>
  <path d="M49 714H75" fill="none" stroke="#59728c" stroke-width="1.8"/>
  <text class="detail" x="86" y="719">Direct communication</text>
  <path d="M288 714H314" fill="none" stroke="#54847d" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text class="detail" x="325" y="719">Optional custody</text>
  <text class="detail" x="1072" y="719" text-anchor="end">Existing routes connect sites; Mesh-Talk does not create a VPN.</text>
</svg>
