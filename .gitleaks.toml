# Gitleaks config — extends the default ruleset with a narrow allowlist.
[extend]
useDefault = true

[[allowlists]]
description = "Paths that legitimately contain key-shaped strings (test fixtures, lockfiles, generated keys, design-doc prose/examples)."
paths = [
  '''Cargo\.lock''',
  '''.*package-lock\.json''',
  '''src-tauri/src/.*tests?\.rs''',
  '''src-tauri/src/commands\.rs''',
  # Design docs / specs / plans are prose with illustrative example values
  # (hashes, ids, snippets) that trip the entropy heuristic — no real secrets.
  '''docs/.*\.md''',
  '''specifications/.*\.md''',
]

# These are public full-version test identities, not credentials. Keep the
# exception tied to both exact values and the verifier example; scan other
# values in the same file and these values in every other file normally.
[[allowlists]]
description = "SDK signed-version fixture identities in the release verifier test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)src-tauri/examples/delta-artifact\.rs$''']
regexTarget = "secret"
regexes = ['''^99\.0\.0-nightly\.42\.[12]$''']

# A Rust public-key field expression is not credential material. Keep other
# expressions and credentials in this file, and this expression elsewhere, scanned.
[[allowlists]]
description = "Public recipient key field in group-file dependency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/mesh-talk-core/src/node/group_file_authorization_tests\.rs$''']
regexTarget = "secret"
regexes = ['''^recipient\.x25519_pub$''']
