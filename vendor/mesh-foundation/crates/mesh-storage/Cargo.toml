[package]
name = "mesh-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OctopusGarage/mesh-foundation"
description = "At-rest record encryption compatible with Mesh Talk"

[features]
test-observability = []

[dependencies]
bincode = "1.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
aes-gcm = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17.14"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
pbkdf2 = "0.12"
sha2 = "0.10"
