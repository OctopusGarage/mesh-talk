[package]
name = "mesh-foundation-storage"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mesh", "peer-to-peer", "sdk"]
categories = ["network-programming"]
description = "At-rest record encryption compatible with Mesh Talk"

[features]
test-observability = []

[dependencies]
bincode = "1.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
aes-gcm = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17.14"
zeroize = "1"

tempfile = "3"

[dev-dependencies]
pbkdf2 = "0.12"
sha2 = "0.10"

[lib]
name = "mesh_storage"

[package.metadata.docs.rs]
all-features = true
