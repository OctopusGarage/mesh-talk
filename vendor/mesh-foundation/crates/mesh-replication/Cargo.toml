[package]
name = "mesh-foundation-replication"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mesh", "peer-to-peer", "sdk"]
categories = ["network-programming"]
description = "Bounded event reconciliation primitives for peer replicas"

[features]
default = ["legacy-wire"]
legacy-wire = ["dep:bincode", "dep:hex", "dep:log", "dep:mesh-identity", "dep:serde"]
mesh-connect = ["dep:mesh-connect", "dep:tokio"]
test-observability = []

[dependencies]
sha2 = "0.10"
bincode = { version = "1.3", optional = true }
hex = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }
mesh-identity = { package = "mesh-foundation-identity", version = "=0.1.0-alpha.2", path = "../mesh-identity", optional = true }
mesh-connect = { package = "mesh-foundation-connect", version = "=0.1.0-alpha.2", path = "../mesh-connect", optional = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

tokio = { version = "1", features = ["io-util"], optional = true }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt", "time"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }

[lib]
name = "mesh_replication"

[package.metadata.docs.rs]
all-features = true
