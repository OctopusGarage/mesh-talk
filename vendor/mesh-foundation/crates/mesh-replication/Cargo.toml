[package]
name = "mesh-replication"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OctopusGarage/mesh-foundation"
description = "Bounded event reconciliation primitives for peer replicas"

[features]
test-observability = []

[dependencies]
sha2 = "0.10"
bincode = "1.3"
hex = "0.4"
log = "0.4"
mesh-identity = { path = "../mesh-identity" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
