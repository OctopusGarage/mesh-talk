[package]
name = "mesh-e2ee"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OctopusGarage/mesh-foundation"
description = "Content encryption state machines for peer applications"

[dependencies]
aes-gcm = "0.11"
bincode = "1.3"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
zeroize = "1"

[dev-dependencies]
hex = "0.4"
