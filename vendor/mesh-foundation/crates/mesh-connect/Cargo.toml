[package]
name = "mesh-connect"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OctopusGarage/mesh-foundation"
description = "Authenticated, encrypted peer sessions for mesh applications"

[features]
test-observability = []

[dependencies]
bincode = "1.3"
futures-util = "0.3"
mesh-identity = { path = "../mesh-identity" }
serde = { version = "1", features = ["derive"] }
if-addrs = "0.15"
log = "0.4"
socket2 = { version = "0.6", features = ["all"] }
snow = "0.9"
tokio = { version = "1", features = ["io-util", "net", "sync"] }

[dev-dependencies]
hex = "0.4"
mesh-identity = { path = "../mesh-identity", features = ["test-observability"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
