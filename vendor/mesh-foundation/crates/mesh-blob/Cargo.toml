[package]
name = "mesh-blob"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OctopusGarage/mesh-foundation"
description = "Chunk encryption and integrity verification for mesh blobs"

[dependencies]
aes-gcm = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zeroize = "1"
