[package]
name = "mesh-foundation-mailbox"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mesh", "peer-to-peer", "sdk"]
categories = ["network-programming"]
description = "Bounded opaque mailbox records, resumable retrieval and durable spool storage"

[features]
default = ["wire", "spool"]
wire = ["dep:bincode"]
spool = ["dep:bincode", "dep:mesh-storage", "dep:rand_core"]

[dependencies]
bincode = { version = "1.3", optional = true }
mesh-replication = { package = "mesh-foundation-replication", version = "=0.1.0-alpha.2", path = "../mesh-replication", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
mesh-storage = { package = "mesh-foundation-storage", version = "=0.1.0-alpha.2", path = "../mesh-storage", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[dev-dependencies]
mesh-identity = { package = "mesh-foundation-identity", version = "=0.1.0-alpha.2", path = "../mesh-identity" }
tempfile = "3"
mesh-connect = { package = "mesh-foundation-connect", version = "=0.1.0-alpha.2", path = "../mesh-connect", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lib]
name = "mesh_mailbox"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "opaque_mailbox"
required-features = ["spool"]
