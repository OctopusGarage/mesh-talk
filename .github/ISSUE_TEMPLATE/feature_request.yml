name: Feature Request
description: Suggest an improvement or new feature
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting an improvement."
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem are you trying to solve?
      placeholder: "I'm trying to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
      description: Describe what users should observe, including relevant failure or permission cases.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Implementation and validation ownership
      description: Identify an existing capability or owning guide if known. The implementer must review consumers, validation contracts and browser/native obligations; unknown ownership can be resolved during triage.
