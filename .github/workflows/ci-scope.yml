name: Select CI scope

on:
  workflow_call:
    outputs:
      full:
        description: Full verification is required unless this exact PR merge contains only inert documentation.
        value: ${{ jobs.select.outputs.full }}

permissions:
  contents: read

jobs:
  select:
    name: Classify CI scope (${{ github.workflow }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          full: auto
