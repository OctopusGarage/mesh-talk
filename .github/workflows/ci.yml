name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_timing:
        description: Full-workspace test-only delivery phase timings
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: every job just checks out and runs tooling — nothing writes back.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MESH_TALK_TEST_TIMING: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/feat/automatic-delivery-receipts') || inputs.diagnostic_timing) && '1' || '0' }}

jobs:
  checks:
    strategy:
      fail-fast: false
      # Tauri targets desktop on all three platforms: verify on Linux (fast, with the
      # GTK/WebKit deps + coverage), macOS, and Windows (so a Windows-only regression is
      # caught on every push, not only at release time).
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri v2 system libraries (Linux only).
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Tauri build reads frontendDist (../frontend/dist), so build the
      # frontend before any cargo step.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Frontend unit tests and coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.run_attempt }}
          path: frontend/coverage/
          if-no-files-found: warn

      - name: Delivery and AI eval smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          make eval-smoke
          node --test scripts/test-ai-eval.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic and release gate regressions (all platforms)
        shell: bash
        run: node --test scripts/diagnostics/*.test.mjs

      - name: Validate release checksum generation
        shell: bash
        run: node --test scripts/diagnostics/release-workflow.test.mjs

      - name: Lint frontend (ESLint)
        if: matrix.os == 'ubuntu-latest'
        working-directory: frontend
        run: npm run lint

      - name: Rustfmt (check)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Linux runs the suite under llvm-cov (below); macOS + Windows run it directly.
      # --workspace so BOTH crates (mesh-talk-core + the app) are tested, not just the app.
      - name: Test (macOS + Windows)
        if: matrix.os != 'ubuntu-latest'
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          if [ "$MESH_TALK_TEST_TIMING" = 1 ]; then
            cargo test --workspace -- --nocapture 2>&1 | tee "$RUNNER_TEMP/mesh-talk-test-timing.log"
          else
            cargo test --workspace
          fi

      # Capture loader evidence when Windows cannot even start the test harness.
      # This diagnostic never turns a failed test step into a successful check.
      - name: Diagnose Windows test loader
        if: failure() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $test = $null
          foreach ($candidate in Get-ChildItem target/debug/deps/mesh_talk-*.exe) {
            Write-Host "Checking test harness: $($candidate.Name)"
            & $candidate.FullName --list
            Write-Host "Harness exit code: $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { $test = $candidate; break }
          }
          if (-not $test) { throw 'No application test executable found' }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $dumpbin.FullName /imports $test.FullName | Select-String 'COMCTL32|TaskDialogIndirect' -Context 2,2
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $mt.FullName "-inputresource:$($test.FullName);#1" "-out:$env:RUNNER_TEMP/test-original.manifest"
          if (Test-Path "$env:RUNNER_TEMP/test-original.manifest") { Get-Content "$env:RUNNER_TEMP/test-original.manifest" }
          $copy = Join-Path $test.DirectoryName 'mesh-talk-loader-diagnostic.exe'
          Copy-Item $test.FullName $copy
          $manifest = Join-Path $env:RUNNER_TEMP 'common-controls.manifest'
          '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" /></dependentAssembly></dependency></assembly>' | Set-Content $manifest -Encoding utf8
          & $mt.FullName -manifest $manifest "-outputresource:$copy;#1"
          if ($LASTEXITCODE -ne 0) { throw 'Manifest embedding failed' }
          & $copy --list
          if ($LASTEXITCODE -ne 0) { throw 'Test harness still cannot load with Common Controls v6' }
          & $copy contact_policy::tests --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native contact policy tests failed' }

      # On Linux, run the tests through llvm-cov so we get coverage in the same
      # pass (avoids compiling/running the suite twice).
      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-llvm-cov

      - name: Test + coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          if [ "$MESH_TALK_TEST_TIMING" = 1 ]; then
            cargo llvm-cov --workspace --lcov --output-path lcov.info -- --nocapture 2>&1 | tee "$RUNNER_TEMP/mesh-talk-test-timing.log"
          else
            cargo llvm-cov --workspace --lcov --output-path lcov.info
          fi

      - name: Upload test timing diagnostics
        if: always() && env.MESH_TALK_TEST_TIMING == '1'
        uses: actions/upload-artifact@v7
        with:
          name: test-timing-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mesh-talk-test-timing.log
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info,src-tauri/lcov.info
          fail_ci_if_error: false

      - name: Spelling (typos)
        if: matrix.os == 'ubuntu-latest'
        uses: crate-ci/typos@v1

      - name: Shellcheck scripts
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck --severity=warning scripts/*.sh scripts/release/*.sh .claude/hooks/*.sh hooks/*

      - name: Validate GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Install supply-chain tools
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-deny,cargo-machete

      # Unused dependencies (knip's Rust equivalent). Cargo.toml files at root.
      - name: Unused dependencies (cargo-machete)
        if: matrix.os == 'ubuntu-latest'
        run: cargo machete

      # Advisories + licenses + bans + sources (config: deny.toml).
      - name: Supply-chain policy (cargo-deny)
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

  # Stable name for the branch-protection required check: stays "verify" no
  # matter how the matrix above evolves.
  verify:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All matrix checks passed
        run: test "${{ needs.checks.result }}" = "success"
