name: Native window diagnostics

on:
  workflow_dispatch:
  # Bootstrap on dev without publishing the diagnostic workflow to main.
  push:
    branches: [dev]
    paths:
      - .github/workflows/native-window-diagnostics.yml
      - scripts/diagnostics/window-controls.mjs
      - src-tauri/capabilities/default.json

permissions:
  contents: read

jobs:
  window-controls:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-window-diagnostics
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb openbox dbus-x11
      - name: Install matching Edge driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $version = (Get-Item $edge).VersionInfo.ProductVersion
          $destination = Join-Path $env:RUNNER_TEMP 'edge-driver'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $archive = Join-Path $destination 'driver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $destination
          $destination >> $env:GITHUB_PATH
          Write-Output "Edge version: $version"
      - name: Install native Tauri driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build actual release application
        run: cargo build --locked --release -p mesh-talk --bin mesh-talk
      - name: Native window controls (Linux)
        if: runner.os == 'Linux'
        env:
          # Software-rendered Xvfb isolates ACL/window behavior from GPU compatibility (#133).
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- bash -e -c '
            openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
            node scripts/diagnostics/window-controls.mjs target/release/mesh-talk
          '
      - name: Native window controls (Windows)
        if: runner.os == 'Windows'
        run: node scripts/diagnostics/window-controls.mjs target/release/mesh-talk.exe
      - name: Upload native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-window-${{ matrix.os }}-${{ github.sha }}
          path: native-window-artifacts/
          retention-days: 7
