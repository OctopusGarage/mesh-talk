name: CodeQL

# Advanced CodeQL setup (replaces GitHub's "default setup") so we can apply a committed
# config — specifically excluding one false-positive-only query (see codeql-config.yml).
# Covers the same languages default setup did: Rust, JavaScript/TypeScript, and Actions.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # codeql-bundle-v2.25.6 (v3)
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        id: analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # codeql-bundle-v2.25.6 (v3)
        with:
          category: "/language:${{ matrix.language }}"

      - name: Reject CodeQL findings
        env:
          CODEQL_SARIF_DIRECTORY: ${{ steps.analysis.outputs['sarif-output'] }}
        run: node scripts/ci/codeql-results.mjs "$CODEQL_SARIF_DIRECTORY"
