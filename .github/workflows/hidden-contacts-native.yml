name: Hidden contacts native evaluation

on:
  workflow_dispatch:
  push:
    branches: [dev, feat/hidden-contacts]
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "crates/mesh-talk-core/**"
      - "Cargo.lock"
      - "scripts/diagnostics/hidden-contacts*"
      - "scripts/diagnostics/native-multicast-probe.mjs"
      - ".github/workflows/hidden-contacts-native.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "crates/mesh-talk-core/**"
      - "Cargo.lock"
      - "scripts/diagnostics/hidden-contacts*"
      - "scripts/diagnostics/native-multicast-probe.mjs"
      - ".github/workflows/hidden-contacts-native.yml"

permissions:
  contents: read

jobs:
  native:
    name: Real native UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies when a scenario fails, not its verdict.
          cache-on-failure: true
      - name: Linux native webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb dbus-x11 xdotool
      - name: Build actual frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Verify fail-closed evidence validator
        run: node --test scripts/diagnostics/hidden-contacts-report.test.mjs
      - name: Diagnose runner multicast capability
        run: node scripts/diagnostics/native-multicast-probe.mjs
      - name: Build production app and CLI with regular KDF
        run: cargo build --release --locked -p mesh-talk --bin mesh-talk -p mesh-talk-core --bin mesh-talk-node
      - name: Build dev-only native driver example
        run: cargo build --release --locked -p mesh-talk --example native-contact-eval
      - name: Run native evaluation (Linux desktop session)
        if: runner.os == 'Linux'
        env:
          NATIVE_CONTACT_OUTPUT: ${{ runner.temp }}/hidden-contacts-native
        run: xvfb-run -a dbus-run-session -- node scripts/diagnostics/hidden-contacts.mjs
      - name: Run native evaluation (Windows and macOS desktop)
        if: runner.os != 'Linux'
        env:
          NATIVE_CONTACT_OUTPUT: ${{ runner.temp }}/hidden-contacts-native
        run: node scripts/diagnostics/hidden-contacts.mjs
      - name: Upload native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hidden-contacts-native-${{ matrix.os }}
          # Publish evidence only, never fixture keystores or account data.
          path: |
            ${{ runner.temp }}/hidden-contacts-native/*.json
            ${{ runner.temp }}/hidden-contacts-native/*.png
            ${{ runner.temp }}/hidden-contacts-native/native-*.log
          if-no-files-found: error
          retention-days: 14
