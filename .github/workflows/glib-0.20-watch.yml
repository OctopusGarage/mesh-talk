name: glib 0.20 bump watch

# glib 0.18.5 is pinned transitively: tauri -> gtk "^0.18" -> glib 0.18.
# RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g is patched in glib >=0.20.0.
# A parallel newer glib branch does not remove the old branch. This monthly job
# probes whether every resolved glib branch migrated; if so it builds + tests
# with glib bumped for advisory evidence only; updates require manual review. While the
# gate holds it is a cheap no-op (just dependency resolution — no system deps, no build).
on:
  schedule:
    - cron: "0 8 1 * *" # 1st of each month, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Probe whether tauri's gtk stack now allows glib 0.20
        id: probe
        run: |
          set -euo pipefail
          # Resolve compatible tauri updates, then inspect every glib package using
          # Cargo.lock's TOML structure, including parallel old/new branches.
          cargo update -p tauri
          python3 -B scripts/ci/glib-migration.py

      - name: Restore unresolved dependency probe
        if: steps.probe.outputs.lifted == 'false'
        run: git checkout -- Cargo.lock

      - name: Install Tauri system dependencies
        if: steps.probe.outputs.lifted == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v7.1.0
        if: steps.probe.outputs.lifted == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (the Tauri build reads frontend/dist)
        if: steps.probe.outputs.lifted == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build + test with glib bumped
        if: steps.probe.outputs.lifted == 'true'
        working-directory: src-tauri
        run: |
          cargo build --lib --bins
          cargo test --lib -- --test-threads=2
