name: UI E2E

# Browser end-to-end tests for the React UI (Playwright + Chromium, headless). Drives the real
# app with a mocked Tauri IPC layer — guards the rendering/wiring that black-screened v0.1.0.
# The Rust multi-process backend E2E lives separately (`make e2e`).
on:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main", "dev"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      extended:
        description: Run extended theme, locale, resize and memory scenarios
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  health:
    uses: ./.github/workflows/check-health.yml
    secrets: inherit

  linux:
    uses: ./.github/workflows/ui-shards.yml
    with:
      operating_systems: '["ubuntu-24.04"]'

  desktop:
    # Admit the desktop browser burst after portable unit/static checks finish.
    needs: health
    uses: ./.github/workflows/ui-shards.yml
    with:
      operating_systems: '["macos-latest","windows-latest"]'

  coverage:
    # This existing name is required by branch protection. It now certifies
    # successful shards plus their complete current-source coverage upload.
    name: Full Linux UI regression
    needs: [linux, health]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Require all browser shards
        working-directory: .
        env:
          BASELINE: ${{ needs.linux.result }}
          UNIT_COVERAGE: ${{ needs.health.result }}
        run: |
          test "$BASELINE" = success
          test "$UNIT_COVERAGE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Download every Linux coverage shard
        uses: actions/download-artifact@v8
        with:
          pattern: ui-coverage-*-${{ github.run_attempt }}
          path: target/ui-coverage
      - name: Download this run's unit coverage
        uses: actions/download-artifact@v8
        with:
          name: ui-unit-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ui-unit-coverage
      - name: Validate unit coverage provenance and restore line map
        run: node ../scripts/ci/unit-coverage-artifact.mjs restore ../target/ui-unit-coverage coverage/lcov.info
      - name: Validate and collect all coverage parts
        run: node ../scripts/ci/collect-ui-coverage.mjs ../target/ui-coverage coverage/e2e-parts "$SOURCE_SHA" 4
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Merge browser coverage
        run: node scripts/merge-e2e-coverage.mjs
      - name: Upload browser coverage
        if: >-
          !(github.event_name == 'pull_request' &&
            github.base_ref == 'dev' &&
            github.event.pull_request.user.login == 'dependabot[bot]')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/e2e.lcov
          flags: ui-e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  portable-evidence:
    name: Chromium portable evidence
    needs: [linux, desktop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all full Chromium shards
        env:
          LINUX: ${{ needs.linux.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: |
          test "$LINUX" = success
          test "$DESKTOP" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: chromium-portable-*-${{ github.run_attempt }}
          path: target/chromium-portable
      - name: Validate every OS and the complete portable inventory
        shell: bash
        run: |
          for entry in ubuntu-24.04:linux macos-latest:darwin windows-latest:win32; do
            os="${entry%:*}"
            platform="${entry#*:}"
            mkdir -p "target/chromium-collected/$platform"
            for shard in 1 2 3 4; do
              mv "target/chromium-portable/chromium-portable-$os-$shard-${{ github.run_attempt }}" "target/chromium-collected/$platform/$shard"
            done
            node scripts/evals/chromium-evidence.mjs collect "target/chromium-collected/$platform" "$platform"
          done
      - name: Preserve validated portable reports
        uses: actions/upload-artifact@v7
        with:
          name: chromium-portable-validated-${{ github.run_attempt }}
          path: target/chromium-collected/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  # HTML presentation is independent of acceptance; raw traces/blob reports
  # remain mandatory artifacts on the test shards themselves.
  reports:
    name: Merged UI reports
    needs: [linux, desktop]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-ui-*-${{ github.run_attempt }}
          path: target/ui-reports
      - name: Render each OS report from its raw blobs
        shell: bash
        run: |
          status=0
          for os in ubuntu-24.04 macos-latest windows-latest; do
            mkdir -p "../target/ui-report-blobs/$os"
            available=true
            for artifact in ../target/ui-reports/playwright-ui-"$os"-*-${{ github.run_attempt }}; do
              cp "$artifact"/blob-report/*.zip "../target/ui-report-blobs/$os/" || available=false
            done
            if [ "$available" != true ]; then
              status=1
              continue
            fi
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$os" npx playwright merge-reports --config playwright.config.ts --reporter=html "../target/ui-report-blobs/$os" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('frontend/playwright-report/**') != ''
        with:
          name: merged-ui-${{ github.run_attempt }}
          path: frontend/playwright-report/
          if-no-files-found: error
          retention-days: 7

  packs:
    name: Optional pack UI and asset check
    needs: health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prepare Ubuntu archive source
        if: runner.os == 'Linux'
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" ../scripts/ci/ubuntu-apt-source.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop build has no bundled packs
        run: npm run build && node ../scripts/release/check-variant-assets.mjs
      - name: Check JavaScript for macOS 12 WKWebView
        run: npm run check:build-syntax
      - name: Download this run's unit coverage
        uses: actions/download-artifact@v8
        with:
          name: ui-unit-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ui-unit-coverage
      - name: Validate unit coverage provenance and restore line map
        run: node ../scripts/ci/unit-coverage-artifact.mjs restore ../target/ui-unit-coverage coverage/lcov.info
      - name: Run sticker and installation flows
        run: npx playwright test e2e/stickers.spec.ts e2e/packs-empty.spec.ts --grep "starts without" --workers=1 --retries=0
        env:
          MESH_TALK_E2E_COVERAGE: "1"
      - name: Merge pack browser coverage
        run: node scripts/merge-e2e-coverage.mjs
      - name: Upload pack browser coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5.5.1
        with:
          files: frontend/coverage/e2e.lcov
          flags: ui-e2e-packs
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  portable:
    name: Portable UI (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, browser: webkit }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prepare Ubuntu archive source
        if: runner.os == 'Linux'
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" ../scripts/ci/ubuntu-apt-source.mjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run real React portable workflows (mocked IPC boundary)
        run: node ../scripts/evals/portable-runner.mjs
        env:
          EVAL_BROWSER: ${{ matrix.browser }}
          EVAL_SOURCE_SHA: ${{ github.sha }}
          EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
      - name: Validate scenario evidence and reject partial or skipped execution
        run: node ../scripts/evals/browser-report.mjs eval-results/portable/${{ matrix.browser }}/${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}/results.json
        env:
          EVAL_BROWSER: ${{ matrix.browser }}
          EVAL_SOURCE_SHA: ${{ github.sha }}
          EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
      - name: Preserve scenario reports screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-ui-${{ matrix.os }}-${{ matrix.browser }}-${{ github.run_attempt }}
          path: frontend/eval-results/portable/
          if-no-files-found: error
          retention-days: 14

  chromium-extended:
    name: Extended Chromium portable (${{ matrix.os }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prepare Ubuntu archive source
        if: runner.os == 'Linux'
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" ../scripts/ci/ubuntu-apt-source.mjs
      - run: npx playwright install --with-deps chromium
      - name: Reserve Windows browser connection capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { throw "Failed to expand the Windows TCP client port range" }
          netsh int ipv4 show dynamicport tcp
      - name: Run and validate extended Chromium evidence
        run: |
          node ../scripts/evals/portable-runner.mjs
          node ../scripts/evals/browser-report.mjs eval-results/portable/chromium/extended/results.json
        env:
          EVAL_BROWSER: chromium
          EVAL_TIER: extended
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - name: Diagnose Windows browser connection failures
        if: (failure() || cancelled()) && runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 show dynamicport tcp
          Get-NetTCPConnection | Group-Object State | Select-Object Count, Name | Format-Table
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-chromium-${{ matrix.os }}-${{ github.run_attempt }}
          path: frontend/eval-results/portable/
          if-no-files-found: error
          retention-days: 14

  firefox-extended:
    name: Extended Firefox UI
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prepare Ubuntu archive source
        if: runner.os == 'Linux'
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" ../scripts/ci/ubuntu-apt-source.mjs
      - run: npx playwright install --with-deps firefox
      - run: node ../scripts/evals/portable-runner.mjs
        env:
          EVAL_BROWSER: firefox
          EVAL_TIER: extended
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - name: Validate extended Firefox evidence
        run: node ../scripts/evals/browser-report.mjs eval-results/portable/firefox/extended/results.json
        env:
          EVAL_BROWSER: firefox
          EVAL_TIER: extended
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-ui-linux-firefox-${{ github.run_attempt }}
          path: frontend/eval-results/portable/
          if-no-files-found: error
          retention-days: 14

  ui-gate:
    name: Playwright UI E2E
    needs: [linux, desktop, coverage, packs, portable-evidence, portable, chromium-extended, firefox-extended]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete selected UI matrices
        env:
          LINUX: ${{ needs.linux.result }}
          DESKTOP: ${{ needs.desktop.result }}
          COVERAGE: ${{ needs.coverage.result }}
          PACKS: ${{ needs.packs.result }}
          CHROMIUM: ${{ needs.portable-evidence.result }}
          PORTABLE: ${{ needs.portable.result }}
          EXTENDED_CHROMIUM: ${{ needs.chromium-extended.result }}
          FIREFOX: ${{ needs.firefox-extended.result }}
          EXTENDED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended) }}
        run: |
          test "$LINUX" = success
          test "$DESKTOP" = success
          test "$COVERAGE" = success
          test "$PACKS" = success
          test "$CHROMIUM" = success
          test "$PORTABLE" = success
          if [ "$EXTENDED" = true ]; then
            test "$EXTENDED_CHROMIUM" = success
            test "$FIREFOX" = success
          else
            test "$EXTENDED_CHROMIUM" = skipped
            test "$FIREFOX" = skipped
          fi
