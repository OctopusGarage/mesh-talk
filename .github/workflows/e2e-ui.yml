name: UI E2E

# Browser end-to-end tests for the React UI (Playwright + Chromium, headless). Drives the real
# app with a mocked Tauri IPC layer — guards the rendering/wiring that black-screened v0.1.0.
# The Rust multi-process backend E2E lives separately (`make e2e`).
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright UI E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI E2E
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
