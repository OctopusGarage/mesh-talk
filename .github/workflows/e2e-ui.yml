name: UI E2E

# Browser end-to-end tests for the React UI (Playwright + Chromium, headless). Drives the real
# app with a mocked Tauri IPC layer — guards the rendering/wiring that black-screened v0.1.0.
# The Rust multi-process backend E2E lives separately (`make e2e`).
on:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      extended:
        description: Run extended theme, locale, resize and memory scenarios
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Full UI regression (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Fresh browser contexts repeatedly load Vite's module graph. Windows'
      # default 16K outbound ports can exhaust before TIME_WAIT sockets expire,
      # leaving unrelated tests with ERR_NO_BUFFER_SPACE and a blank login page.
      # Keep the server's port 5173 outside this disposable runner's client pool.
      - name: Reserve Windows browser connection capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { throw "Failed to expand the Windows TCP client port range" }
          netsh int ipv4 show dynamicport tcp
      # One browser per runner preserves the existing resource budget. Spread
      # tests across machines rather than competing with Vite on one runner.
      - name: Run UI E2E
        run: npx playwright test --workers=1 --retries=0 --shard=${{ matrix.shard }}/4 --reporter=list,blob
        env:
          MESH_TALK_E2E_COVERAGE: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Diagnose Windows browser connection failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 show dynamicport tcp
          Get-NetTCPConnection | Group-Object State | Select-Object Count, Name | Format-Table
      - name: Record Linux coverage identity
        if: runner.os == 'Linux'
        run: >-
          node --input-type=module -e
          'import { writeFileSync } from "node:fs";
          writeFileSync("coverage/shard.json", JSON.stringify({ sourceSha: process.env.SOURCE_SHA, shard: Number(process.env.SHARD), total: 4 }));'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SHARD: ${{ matrix.shard }}
      - name: Upload Linux coverage parts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            frontend/coverage/shard.json
            frontend/coverage/e2e-parts/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_attempt }}
          compression-level: 0 # Blob ZIPs, traces and screenshots are already compressed.
          path: |
            frontend/blob-report/
            frontend/test-results/
          if-no-files-found: error
          retention-days: 7

  unit-coverage:
    # Both Linux browser variants use the same default-mode unit line map.
    # Keep this producer in this workflow: no cross-workflow evidence reuse.
    name: Linux unit coverage for browser line maps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prepare shared coverable line map
        run: npm run test:coverage
      - name: Seal unit coverage provenance
        run: node ../scripts/ci/unit-coverage-artifact.mjs seal coverage/lcov.info ../target/ui-unit-coverage
      - name: Upload source-pinned unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: ui-unit-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ui-unit-coverage/
          if-no-files-found: error
          retention-days: 7

  coverage:
    # This existing name is required by branch protection. It now certifies
    # successful shards plus their complete current-source coverage upload.
    name: Full Linux UI regression
    needs: [e2e, unit-coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Require all browser shards
        working-directory: .
        env:
          BASELINE: ${{ needs.e2e.result }}
          UNIT_COVERAGE: ${{ needs.unit-coverage.result }}
        run: |
          test "$BASELINE" = success
          test "$UNIT_COVERAGE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Download every Linux coverage shard
        uses: actions/download-artifact@v8
        with:
          pattern: ui-coverage-*-${{ github.run_attempt }}
          path: target/ui-coverage
      - name: Download this run's unit coverage
        uses: actions/download-artifact@v8
        with:
          name: ui-unit-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ui-unit-coverage
      - name: Validate unit coverage provenance and restore line map
        run: node ../scripts/ci/unit-coverage-artifact.mjs restore ../target/ui-unit-coverage coverage/lcov.info
      - name: Validate and collect all coverage parts
        run: node ../scripts/ci/collect-ui-coverage.mjs ../target/ui-coverage coverage/e2e-parts "$SOURCE_SHA" 4
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Merge browser coverage
        run: node scripts/merge-e2e-coverage.mjs
      - name: Upload browser coverage
        if: >-
          !(github.event_name == 'pull_request' &&
            github.base_ref == 'dev' &&
            github.event.pull_request.user.login == 'dependabot[bot]')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/e2e.lcov
          flags: ui-e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # HTML presentation is independent of acceptance; raw traces/blob reports
  # remain mandatory artifacts on the test shards themselves.
  reports:
    name: Merged UI report (${{ matrix.os }})
    needs: e2e
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-ui-${{ matrix.os }}-*-${{ github.run_attempt }}
          path: target/ui-reports
          merge-multiple: true
      # Artifact roots include blob-report/ and test-results/. An explicit
      # testDir in this config also normalizes Windows/macOS source paths.
      - run: npx playwright merge-reports --config playwright.config.ts --reporter=html ../target/ui-reports/blob-report
      - uses: actions/upload-artifact@v7
        with:
          name: merged-ui-${{ matrix.os }}-${{ github.run_attempt }}
          path: frontend/playwright-report/
          if-no-files-found: error
          retention-days: 7

  packs:
    name: Optional pack UI and asset check
    needs: unit-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop build has no bundled packs
        run: npm run build && node ../scripts/release/check-variant-assets.mjs
      - name: Check JavaScript for macOS 12 WKWebView
        run: npm run check:build-syntax
      - name: Download this run's unit coverage
        uses: actions/download-artifact@v8
        with:
          name: ui-unit-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ui-unit-coverage
      - name: Validate unit coverage provenance and restore line map
        run: node ../scripts/ci/unit-coverage-artifact.mjs restore ../target/ui-unit-coverage coverage/lcov.info
      - name: Run sticker and installation flows
        run: npx playwright test e2e/stickers.spec.ts e2e/packs-empty.spec.ts --grep "starts without" --workers=1 --retries=0
        env:
          MESH_TALK_E2E_COVERAGE: "1"
      - name: Merge pack browser coverage
        run: node scripts/merge-e2e-coverage.mjs
      - name: Upload pack browser coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5.5.1
        with:
          files: frontend/coverage/e2e.lcov
          flags: ui-e2e-packs
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  portable:
    name: Portable UI (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, browser: chromium }
          - { os: windows-2022, browser: chromium }
          - { os: macos-latest, browser: chromium }
          - { os: macos-latest, browser: webkit }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Portable workflows load the same Vite module graph as the full UI suite.
      # Preserve its Windows client-port budget here as well; the server's
      # default portable port (5174) stays outside the disposable client pool.
      - name: Reserve Windows browser connection capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { throw "Failed to expand the Windows TCP client port range" }
          netsh int ipv4 show dynamicport tcp
      - name: Run real React portable workflows (mocked IPC boundary)
        run: node ../scripts/evals/portable-runner.mjs
        env:
          EVAL_BROWSER: ${{ matrix.browser }}
          EVAL_SOURCE_SHA: ${{ github.sha }}
          EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
      - name: Diagnose Windows browser connection failures
        if: (failure() || cancelled()) && runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 show dynamicport tcp
          Get-NetTCPConnection | Group-Object State | Select-Object Count, Name | Format-Table
      - name: Validate scenario evidence and reject partial or skipped execution
        run: node ../scripts/evals/browser-report.mjs eval-results/portable/${{ matrix.browser }}/${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}/results.json
        env:
          EVAL_BROWSER: ${{ matrix.browser }}
          EVAL_SOURCE_SHA: ${{ github.sha }}
          EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
      - name: Preserve scenario reports screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-ui-${{ matrix.os }}-${{ matrix.browser }}-${{ github.run_attempt }}
          path: frontend/eval-results/portable/
          if-no-files-found: error
          retention-days: 14

  firefox-extended:
    name: Extended Firefox UI
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: node ../scripts/evals/portable-runner.mjs
        env:
          EVAL_BROWSER: firefox
          EVAL_TIER: extended
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - name: Validate extended Firefox evidence
        run: node ../scripts/evals/browser-report.mjs eval-results/portable/firefox/extended/results.json
        env:
          EVAL_BROWSER: firefox
          EVAL_TIER: extended
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-ui-linux-firefox-${{ github.run_attempt }}
          path: frontend/eval-results/portable/
          if-no-files-found: error
          retention-days: 14

  ui-gate:
    name: Playwright UI E2E
    needs: [e2e, coverage, packs, portable, firefox-extended]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete selected UI matrices
        env:
          BASELINE: ${{ needs.e2e.result }}
          COVERAGE: ${{ needs.coverage.result }}
          PACKS: ${{ needs.packs.result }}
          PORTABLE: ${{ needs.portable.result }}
          FIREFOX: ${{ needs.firefox-extended.result }}
          EXTENDED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended) }}
        run: |
          test "$BASELINE" = success
          test "$COVERAGE" = success
          test "$PACKS" = success
          test "$PORTABLE" = success
          if [ "$EXTENDED" = true ]; then
            test "$FIREFOX" = success
          else
            test "$FIREFOX" = skipped
          fi
