name: UI E2E

# Browser end-to-end tests for the React UI (Playwright + Chromium, headless). Drives the real
# app with a mocked Tauri IPC layer — guards the rendering/wiring that black-screened v0.1.0.
# The Rust multi-process backend E2E lives separately (`make e2e`).
on:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main", "dev"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      extended:
        description: Run extended theme, locale, resize and memory scenarios
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  health:
    if: ${{ !cancelled() }}
    needs: [scope]
    uses: ./.github/workflows/check-health.yml
    with:
      full: ${{ needs.scope.outputs.full }}
      upstream_result: ${{ needs.scope.result }}
    secrets: inherit

  linux:
    if: needs.scope.outputs.full == 'true'
    needs: [scope]
    uses: ./.github/workflows/ui-shards.yml
    with:
      operating_systems: '["ubuntu-24.04"]'

  desktop:
    if: needs.scope.outputs.full == 'true'
    # Preserve native Mac admission; reuse the four-slot per-OS browser budget.
    needs: [health, portable, scope]
    uses: ./.github/workflows/ui-shards.yml
    with:
      operating_systems: '["macos-26-intel"]'
      shards: '[1,2,3,4,5,6,7,8]'
      shard_total: 8

  desktop-windows:
    if: needs.scope.outputs.full == 'true'
    needs: [health, scope]
    uses: ./.github/workflows/ui-shards.yml
    with:
      operating_systems: '["windows-latest"]'
      shards: '[1,2,3,4]'
      shard_total: 4

  coverage:
    # This existing name is required by branch protection. It now certifies
    # successful shards plus their complete current-source coverage upload.
    name: Full Linux UI regression
    needs: [linux, health, scope]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          full: ${{ needs.scope.outputs.full }}
          upstream_result: ${{ needs.scope.result }}
      - name: Require all browser shards
        if: ${{ steps.scope.outputs.full == 'true' }}
        working-directory: .
        env:
          BASELINE: ${{ needs.linux.result }}
          UNIT_COVERAGE: ${{ needs.health.result }}
        run: |
          test "$BASELINE" = success
          test "$UNIT_COVERAGE" = success
      - uses: actions/setup-node@v7.1.0
        if: ${{ steps.scope.outputs.full == 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: ${{ steps.scope.outputs.full == 'true' }}
      - name: Download every Linux coverage shard
        if: ${{ steps.scope.outputs.full == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: ui-coverage-*-${{ github.run_attempt }}
          path: target/ui-coverage
      - name: Download this run's unit coverage
        if: ${{ steps.scope.outputs.full == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ui-unit-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ui-unit-coverage
      - name: Validate unit coverage provenance and restore line map
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: node ../scripts/ci/unit-coverage-artifact.mjs restore ../target/ui-unit-coverage coverage/lcov.info
      - name: Validate and collect all coverage parts
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: node ../scripts/ci/collect-ui-coverage.mjs ../target/ui-coverage coverage/e2e-parts "$SOURCE_SHA" 4
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Merge browser coverage
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: node scripts/merge-e2e-coverage.mjs
      - name: Upload browser coverage
        if: ${{ steps.scope.outputs.full == 'true' && (!(github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.user.login == 'dependabot[bot]')) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.2
          files: frontend/coverage/e2e.lcov
          flags: ui-e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  portable-evidence:
    name: Chromium portable evidence
    needs: [linux, desktop, desktop-windows, scope]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          full: ${{ needs.scope.outputs.full }}
          upstream_result: ${{ needs.scope.result }}
      - name: Require all full Chromium shards
        if: ${{ steps.scope.outputs.full == 'true' }}
        env:
          LINUX: ${{ needs.linux.result }}
          DESKTOP: ${{ needs.desktop.result }}
          WINDOWS: ${{ needs.desktop-windows.result }}
        run: |
          test "$LINUX" = success
          test "$DESKTOP" = success
          test "$WINDOWS" = success
      - uses: actions/setup-node@v7.1.0
        if: ${{ steps.scope.outputs.full == 'true' }}
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: ${{ steps.scope.outputs.full == 'true' }}
        with:
          pattern: chromium-portable-*-${{ github.run_attempt }}
          path: target/chromium-portable
      - name: Validate every OS and the complete portable inventory
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: node scripts/evals/chromium-evidence.mjs collect-artifacts target/chromium-portable target/chromium-collected
      - name: Preserve validated portable reports
        if: ${{ steps.scope.outputs.full == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: chromium-portable-validated-${{ github.run_attempt }}
          path: target/chromium-collected/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  # HTML presentation is independent of acceptance; raw traces/blob reports
  # remain mandatory artifacts on the test shards themselves.
  reports:
    name: Merged UI reports
    needs: [linux, desktop, desktop-windows, scope]
    if: ${{ !cancelled() && needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-ui-*-${{ github.run_attempt }}
          path: target/ui-reports
      - name: Render each OS report from its raw blobs
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          WINDOWS_RESULT: ${{ needs.desktop-windows.result }}
        run: node ../scripts/evals/chromium-evidence.mjs render-artifacts ../target/ui-reports ../target/ui-report-blobs
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        if: always() && hashFiles('frontend/playwright-report/**') != ''
        with:
          name: merged-ui-${{ github.run_attempt }}
          path: frontend/playwright-report/
          if-no-files-found: error
          retention-days: 7

  packs:
    if: needs.scope.outputs.full == 'true'
    needs: [scope]
    name: Optional pack UI and asset check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify desktop build has no bundled packs
        run: npm run build && node ../scripts/release/check-variant-assets.mjs
      - name: Check JavaScript for macOS 12 WKWebView
        run: npm run check:build-syntax

  portable-shards:
    if: needs.scope.outputs.full == 'true'
    needs: [scope]
    name: WebKit portable partition (${{ matrix.shard }}/2)
    runs-on: macos-26-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    env:
      EVAL_BROWSER: webkit
      EVAL_SOURCE_SHA: ${{ github.sha }}
      EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
      EVAL_EVIDENCE_ROOT: eval-results/webkit/raw
      PLAYWRIGHT_JSON_OUTPUT_FILE: eval-results/webkit/raw/results.json
    steps:
      - name: Reserve partition cleanup and evidence time
        working-directory: .
        shell: bash
        run: echo "MESH_UI_DEADLINE_MS=$(( $(date +%s) * 1000 + 18 * 60000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Run real React portable workflows (mocked IPC boundary)
        run: node ../scripts/ci/ui-runner.mjs --config=playwright.portable.config.ts --workers=1 --retries=0 --shard=${{ matrix.shard }}/2 --reporter=list,json,../scripts/ci/ui-runner.mjs
      - name: Seal source-pinned partition evidence
        run: node ../scripts/evals/portable-runner.mjs seal-partition eval-results/webkit/raw/results.json eval-results/webkit/sealed ${{ matrix.shard }}
      - name: Preserve partition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-partition-${{ matrix.shard }}-${{ github.run_attempt }}
          path: frontend/eval-results/webkit/sealed/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve interrupted partition diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: webkit-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            frontend/eval-results/webkit/raw/
            frontend/ui-runner-evidence/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  portable:
    name: Portable UI (macos-26-intel, webkit)
    needs: [portable-shards, scope]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVAL_SOURCE_SHA: ${{ github.sha }}
      EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          full: ${{ needs.scope.outputs.full }}
          upstream_result: ${{ needs.scope.result }}
      - name: Require both WebKit partitions
        if: ${{ steps.scope.outputs.full == 'true' }}
        env:
          PRODUCER: ${{ needs.portable-shards.result }}
        run: test "$PRODUCER" = success
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: ${{ steps.scope.outputs.full == 'true' }}
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        if: ${{ steps.scope.outputs.full == 'true' }}
        with:
          pattern: webkit-partition-*-${{ github.run_attempt }}
          path: target/webkit-partitions
      - name: Validate complete WebKit evidence union
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: node scripts/evals/portable-runner.mjs collect-partitions target/webkit-partitions
      - uses: actions/upload-artifact@v7
        if: ${{ steps.scope.outputs.full == 'true' }}
        with:
          name: portable-ui-macos-26-intel-webkit-${{ github.run_attempt }}
          path: target/webkit-partitions/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  chromium-extended:
    name: Extended Chromium portable (${{ matrix.os }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prepare Ubuntu archive source
        if: runner.os == 'Linux'
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" ../scripts/ci/ubuntu-apt-source.mjs
      - run: npx playwright install --with-deps chromium
      - name: Reserve Windows browser connection capacity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) { throw "Failed to expand the Windows TCP client port range" }
          netsh int ipv4 show dynamicport tcp
      - name: Run and validate extended Chromium evidence
        run: |
          node ../scripts/evals/portable-runner.mjs
          node ../scripts/evals/browser-report.mjs eval-results/portable/chromium/extended/results.json
        env:
          EVAL_BROWSER: chromium
          EVAL_TIER: extended
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - name: Diagnose Windows browser connection failures
        if: (failure() || cancelled()) && runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 show dynamicport tcp
          Get-NetTCPConnection | Group-Object State | Select-Object Count, Name | Format-Table
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-chromium-${{ matrix.os }}-${{ github.run_attempt }}
          path: frontend/eval-results/portable/
          if-no-files-found: error
          retention-days: 14

  firefox-extended:
    if: needs.scope.outputs.full == 'true'
    needs: [scope]
    name: Firefox portable UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prepare Ubuntu archive source
        if: runner.os == 'Linux'
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" ../scripts/ci/ubuntu-apt-source.mjs
      - run: npx playwright install --with-deps firefox
      - run: node ../scripts/evals/portable-runner.mjs
        env:
          EVAL_BROWSER: firefox
          EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - name: Validate complete Firefox evidence
        run: node ../scripts/evals/browser-report.mjs eval-results/portable/firefox/${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}/results.json
        env:
          EVAL_BROWSER: firefox
          EVAL_TIER: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)) && 'extended' || 'core' }}
          EVAL_SOURCE_SHA: ${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-ui-linux-firefox-${{ github.run_attempt }}
          path: frontend/eval-results/portable/
          if-no-files-found: error
          retention-days: 14

  ui-gate:
    name: Playwright UI E2E
    needs: [linux, desktop, desktop-windows, coverage, packs, portable-evidence, portable, chromium-extended, firefox-extended, scope]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          full: ${{ needs.scope.outputs.full }}
          upstream_result: ${{ needs.scope.result }}
      - name: Require complete selected UI matrices
        if: ${{ steps.scope.outputs.full == 'true' }}
        env:
          LINUX: ${{ needs.linux.result }}
          DESKTOP: ${{ needs.desktop.result }}
          WINDOWS: ${{ needs.desktop-windows.result }}
          COVERAGE: ${{ needs.coverage.result }}
          PACKS: ${{ needs.packs.result }}
          CHROMIUM: ${{ needs.portable-evidence.result }}
          PORTABLE: ${{ needs.portable.result }}
          EXTENDED_CHROMIUM: ${{ needs.chromium-extended.result }}
          FIREFOX: ${{ needs.firefox-extended.result }}
          EXTENDED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended) }}
        run: |
          test "$LINUX" = success
          test "$DESKTOP" = success
          test "$WINDOWS" = success
          test "$COVERAGE" = success
          test "$PACKS" = success
          test "$CHROMIUM" = success
          test "$PORTABLE" = success
          test "$FIREFOX" = success
          if [ "$EXTENDED" = true ]; then
            test "$EXTENDED_CHROMIUM" = success
          else
            test "$EXTENDED_CHROMIUM" = skipped
          fi
