name: Gitleaks

# Secret scanning — fails the build if a credential-shaped string lands in the
# tree or history (keys, tokens). Runs the gitleaks CLI directly (MIT, free).
on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the scan only checks out history and runs the gitleaks CLI.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so a secret in any commit is caught
      - name: Run gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-gitleaks.sh
