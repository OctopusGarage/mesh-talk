name: Mutation Testing

# cargo-mutants injects bugs and checks the test suite catches them (the Rust
# equivalent of Stryker). It runs the suite once per mutant, so it is slow:
#   - on PRs it only tests mutants in the changed lines (fast),
#   - weekly / on demand it runs the full sweep.
# Surviving mutants are surfaced as annotations + an artifact but do NOT block
# (this is an existing codebase; treat results as a coverage-quality signal).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # PR-diff mode needs history

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-mutants@27.1.0

      - name: Compute PR diff
        if: github.event_name == 'pull_request'
        run: git diff "origin/${{ github.base_ref }}"...HEAD > mutants-diff.patch

      # Surviving mutants are advisory, but a broken baseline is not valid evidence.
      - name: Validate command forwarding and unmutated baseline
        run: |
          node --test scripts/diagnostics/mutants-workflow.test.mjs
          cargo test --workspace -- --test-threads=2

      - name: Mutants (PR diff)
        if: github.event_name == 'pull_request'
        working-directory: src-tauri
        run: node ../scripts/release/run-mutants.mjs --in-diff ../mutants-diff.patch

      - name: Mutants (full sweep)
        if: github.event_name != 'pull_request'
        working-directory: src-tauri
        run: node ../scripts/release/run-mutants.mjs

      - name: Upload mutants report
        # A test-only/config-only diff can exit successfully without creating a report.
        if: always() && hashFiles('mutants.out/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: error
