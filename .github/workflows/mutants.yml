name: Mutation Testing

# cargo-mutants injects bugs and checks the test suite catches them (the Rust
# equivalent of Stryker). It runs the suite once per mutant, so it is slow:
#   - on PRs it samples mutants in the changed lines,
#   - on main, weekly, or on demand it samples the whole workspace.
# Each run tests one of 256 rotating round-robin samples, divided across four
# runners. Each summary states its subshard and result count.
# Surviving mutants are surfaced as annotations + an artifact but do NOT block
# (this is an existing codebase; treat results as a coverage-quality signal).
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # Keep other reports if one runner has a baseline/tool failure.
      matrix:
        worker: [0, 1, 2, 3]
    env:
      # rust-cache otherwise defaults this to 0, defeating per-mutant rebuild reuse.
      CARGO_INCREMENTAL: '1'
      MUTATION_WORKER: ${{ matrix.worker }}
      MUTATION_WORKERS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # PR-diff mode needs history

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: mutants

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install mutation test tools
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148

      - name: Compute PR diff
        if: github.event_name == 'pull_request'
        run: git diff "origin/${{ github.base_ref }}"...HEAD > mutants-diff.patch

      # cargo-mutants runs and validates its own baseline before injecting bugs.
      - name: Validate mutation runner
        run: node --test scripts/diagnostics/mutants-workflow.test.mjs scripts/diagnostics/mutation-evidence.test.mjs scripts/release/run-mutants.test.mjs

      - name: Mutants (PR diff)
        if: github.event_name == 'pull_request'
        working-directory: src-tauri
        run: node ../scripts/release/run-mutants.mjs --in-diff ../mutants-diff.patch

      - name: Mutants (workspace sample)
        if: github.event_name != 'pull_request'
        working-directory: src-tauri
        run: node ../scripts/release/run-mutants.mjs

      - name: Upload mutants report
        # A test-only/config-only diff can exit successfully without creating a report.
        if: always() && hashFiles('mutants.out/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report-${{ matrix.worker }}
          path: mutants.out/
          if-no-files-found: error

  # Preserve the stable branch-protection check across matrix size changes.
  mutation-gate:
    name: mutants
    needs: mutants
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all mutation shards
        env:
          SHARDS: ${{ needs.mutants.result }}
        run: |
          test "$SHARDS" = success
