name: Mutation Testing

# Pull requests, merge candidates and main pushes verify the pinned runner's
# real caught/survivor/baseline/hang/empty-selection behavior. Broad workspace
# mutation samples run daily or on explicit dispatch, independently of merging.
# Deep samples retain complete baselines, all consumers and strict reports.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # Daily deep assurance, outside the merge critical path
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  runner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.150
          fallback: none
      - name: Verify pinned mutation runner behavior
        run: node --test scripts/diagnostics/mutants-workflow.test.mjs scripts/diagnostics/mutation-evidence.test.mjs scripts/release/run-mutants.test.mjs scripts/release/mutation-process-owner.test.mjs

  plan:
    name: Plan complete rotating mutation sample
    needs: runner-contract
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '1'
    outputs:
      selected: ${{ steps.selection.outputs.selected }}
      matrix: ${{ steps.selection.outputs.matrix }}
      rust: ${{ steps.selection.outputs.rust }}
      node: ${{ steps.selection.outputs.node }}
      digest: ${{ steps.selection.outputs.digest }}
      producer_attempt: ${{ steps.selection.outputs.producer_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.150
          fallback: none
      - name: Select mutation sample
        id: selection
        working-directory: src-tauri
        run: node ../scripts/release/run-mutants.mjs --plan "$RUNNER_TEMP/mutation-plan"
      - name: Preserve mutation plan
        id: upload
        if: always() && (steps.selection.outcome == 'success' || steps.selection.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: mutation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-plan/
          if-no-files-found: error
          retention-days: 7

  baseline:
    name: Complete unmutated workspace baseline
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.selected != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CARGO_INCREMENTAL: '1'
      MUTATION_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
      MUTATION_PLAN_ATTEMPT: ${{ needs.plan.outputs.producer_attempt }}
    outputs:
      digest: ${{ steps.baseline.outputs.digest }}
      producer_attempt: ${{ steps.baseline.outputs.producer_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.plan.outputs.rust }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ needs.plan.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install mutation test tools
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.150
          fallback: none
      - name: Download exact mutation plan
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/mutation-plan
      - name: Prepare hosted Linux build storage
        id: runner_storage
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" scripts/ci/runner-storage.mjs --prepare | tee "$RUNNER_TEMP/runner-storage.json"
      - name: Preserve runner storage measurements
        if: always() && steps.runner_storage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: runner-storage-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-storage.json
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Ubuntu archive source
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" scripts/ci/ubuntu-apt-source.mjs
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache mutation build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: '.'
          # Equivalent to the original key=mutants plus job=mutants prefix.
          shared-key: mutants-mutants
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Execute and seal complete baseline
        id: baseline
        working-directory: src-tauri
        run: node ../scripts/release/run-mutants.mjs --baseline "$RUNNER_TEMP/mutation-plan" "$RUNNER_TEMP/mutation-baseline"
      - name: Preserve real baseline evidence
        id: upload
        if: always() && (steps.baseline.outcome == 'success' || steps.baseline.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: mutation-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-baseline/
          if-no-files-found: error
          retention-days: 7

  mutants:
    name: Workspace mutation sample (${{ matrix.worker }})
    needs: [plan, baseline]
    if: needs.plan.result == 'success' && needs.plan.outputs.selected != '0' && needs.baseline.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: '1'
      MUTATION_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
      MUTATION_PLAN_ATTEMPT: ${{ needs.plan.outputs.producer_attempt }}
      MUTATION_BASELINE_DIGEST: ${{ needs.baseline.outputs.digest }}
      MUTATION_BASELINE_ATTEMPT: ${{ needs.baseline.outputs.producer_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.plan.outputs.rust }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ needs.plan.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install mutation test tools
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.150
          fallback: none
      - name: Download exact mutation plan
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/mutation-plan
      - name: Prepare hosted Linux build storage
        id: runner_storage
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" scripts/ci/runner-storage.mjs --prepare | tee "$RUNNER_TEMP/runner-storage.json"
      - name: Preserve runner storage measurements
        if: always() && steps.runner_storage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: runner-storage-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-storage.json
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Ubuntu archive source
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS "$(command -v node)" scripts/ci/ubuntu-apt-source.mjs
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache mutation build
        uses: Swatinem/rust-cache@v2
        with:
          # The baseline is the sole trusted writer of the existing shared key.
          save-if: 'false'
          workspaces: '.'
          key: mutants
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Download exact successful baseline producer artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.baseline.outputs.artifact_id }}
          path: ${{ runner.temp }}/mutation-baseline
      - name: Mutants (workspace sample)
        id: execution
        working-directory: src-tauri
        env:
          MUTATION_WORKER: ${{ matrix.worker }}
        run: node ../scripts/release/run-mutants.mjs --worker "$RUNNER_TEMP/mutation-plan" "$RUNNER_TEMP/mutation-baseline" "$RUNNER_TEMP/mutation-worker" "$MUTATION_WORKER"
      - name: Upload mutants report
        if: always() && (steps.execution.outcome == 'success' || steps.execution.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report-${{ matrix.worker }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-worker/
          if-no-files-found: error
          retention-days: 14

  mutation-gate:
    name: mutants
    needs: [runner-contract, plan, baseline, mutants]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Require all planned work and runner contracts
        env:
          CONTRACTS: ${{ needs.runner-contract.result }}
          DEEP: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          PLAN: ${{ needs.plan.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          BASELINE: ${{ needs.baseline.result }}
          SHARDS: ${{ needs.mutants.result }}
        run: node scripts/release/run-mutants.mjs --gate
