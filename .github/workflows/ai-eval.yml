name: AI Eval

# Deterministic eval-smoke and harness tests run on PRs that touch prompts, agent rules,
# workflow wiring, or eval assets. The real model-backed eval is semi-automatic: configure
# AI_EVAL_COMMAND as a repository secret and run this workflow manually, or let the path
# trigger run it when the secret exists.
on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".claude/**"
      - "docs/evals/**"
      - "scripts/ai-eval*.mjs"
      - "scripts/ai-eval-smoke.sh"
      - "scripts/run-real-smoke.sh"
      - ".github/workflows/ai-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic eval contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Eval smoke
        run: make eval-smoke
      - name: AI eval harness tests
        run: node --test scripts/test-ai-eval.mjs

  real-ai-eval:
    name: Real model-backed AI eval
    needs: [provider-status]
    if: needs.provider-status.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      AI_EVAL_COMMAND: ${{ secrets.AI_EVAL_COMMAND }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run real AI eval when provider is configured
        run: make ai-eval
      - name: Upload AI eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-eval-report
          path: target/ai-eval/
          if-no-files-found: error

  provider-status:
    name: Report AI provider availability (not an eval result)
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.provider.outputs.configured }}
    steps:
      - name: Disclose whether real model evaluation can run
        id: provider
        env:
          AI_EVAL_COMMAND: ${{ secrets.AI_EVAL_COMMAND }}
        run: |
          if [ -n "${AI_EVAL_COMMAND:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Real-model provider configured; evaluation verdict comes from the separate job.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Real-model evaluation NOT RUN: provider unavailable. Deterministic contracts are not model-backed eval evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
